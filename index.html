home:()=>`<section class="hero"><div><h1>Naya phone, sahi daam par.</h1><p>Genuine smartphones and accessories with official warranty, GST bill and same-day WhatsApp support.</p><div class="row"><a class="btn" href="#phones">Shop phones</a><a class="btn ghost" href="#contact">Visit the store</a></div></div><div><div class="scene" aria-label="3D phone model"><div class="ph" id="ph3d"><div class="f"><div class="scr"><div class="isl"></div><small>Mobile Gallery</small><b>9:41</b><small>Premium. Genuine.</small></div></div><div class="b"><div class="cam"><i></i><i></i><i></i></div></div><div class="sl"></div><div class="sr"></div></div></div><p class="hint">Drag to rotate the phone</p></div></section>
<section class="sec"><h2>Featured phones</h2><p class="mut">Hand-picked flagships and best-value picks.</p><div class="grid">${S.phones.slice(0,4).map(card).join('')}</div><p><a class="btn ghost" href="#phones">See all phones</a></p></section>
<section class="sec"><h2>Why Mobile Gallery</h2><div class="feat" style="margin-top:22px"><div><span>✅</span><h3>100% genuine</h3><p>Sealed boxes with GST invoice.</p></div><div><span>🛡️</span><h3>Official warranty</h3><p>Brand-backed service nationwide.</p></div><div><span>💬</span><h3>WhatsApp buying</h3><p>Ask, confirm and book in minutes.</p></div><div><span>🚚</span><h3>Same-day delivery</h3><p>Fast local delivery on request.</p></div></div></section>
<section class="sec"><h2>Essentials</h2><div class="grid">${S.acc.slice(0,4).map(card).join('')}</div></section>
<section class="sec"><h2>Loved by customers</h2><div class="feat" style="margin-top:22px">${S.reviews.slice(0,3).map(rvc).join('')}</div></section>
<section class="sec"><h2>Services that come with every phone</h2><div class="feat" style="margin-top:22px"><div><h3>Exchange your old phone</h3><p>Get an instant quote on WhatsApp and upgrade for less.</p></div><div><h3>Easy EMI</h3><p>No-cost EMI on select cards and finance partners.</p></div><div><h3>Free setup</h3><p>Data transfer, screen guard and case fitting included.</p></div><div><h3>After-sales care</h3><p>Warranty claims and repairs handled for you.</p></div></div><p><a class="btn" target="_blank" rel="noopener" href="${wa('Hi Mobile Gallery, I want an exchange quote for my old phone.')}">Get an exchange quote</a></p></section>
<section class="sec"><h2>Questions, answered</h2><div style="margin-top:20px;max-width:760px"><details><summary>Are all phones genuine and sealed?</summary><p>Yes. Every phone is sealed, comes with a GST invoice and official brand warranty.</p></details><details><summary>How do I place an order?</summary><p>Tap Buy on WhatsApp on any product. We confirm price, stock and delivery with you directly.</p></details><details><summary>Do you offer same-day delivery?</summary><p>Yes, within the city for orders confirmed before 6 pm.</p></details><details><summary>Can I return or replace a phone?</summary><p>Manufacturing defects are replaced under brand policy. Our team helps with the claim.</p></details></div></section>
<div class="cta"><h2>Looking for a specific model?</h2><p>Message us the model and we will share the best price.</p><a class="btn" target="_blank" rel="noopener" href="${wa('Hi Mobile Gallery, I need a price for a phone.')}">Chat on WhatsApp</a></div>`,
phones:()=>{const bs=['All',...new Set(S.phones.map(p=>p.brand))];return `<section class="sec">${head('Smartphones','Every phone comes sealed with warranty. Tap Buy to order on WhatsApp.')}<div class="bar"><input id="q" aria-label="Search" placeholder="Search phones" value="${E(fq)}" oninput="fq=this.value;$('#list').innerHTML=pl()"><select aria-label="Sort" onchange="so=this.value;route(1)"><option value="">Sort: Featured</option><option value="l" ${so==='l'?'selected':''}>Price: low to high</option><option value="h" ${so==='h'?'selected':''}>Price: high to low</option></select>${bs.map(b=>`<button class="chip ${b===fb?'on':''}" data-b="${E(b)}" onclick="fb=this.dataset.b;route(1)">${E(b)}</button>`).join('')}</div><div id="list" class="grid">${pl()}</div></section>`},
accessories:()=>`<section class="sec">${head('Essentials','Cases, chargers, audio and more. Everything tested in store.')}<div class="grid">${S.acc.map(card).join('')||'<p class="mut">No accessories yet.</p>'}</div></section>`,
gallery:()=>`<section class="sec">${head('Showcase','A look inside Mobile Gallery.')}<div class="mas">${S.gallery.map((g,i)=>`<div class="card"><div class="pa" style="height:${[220,280,200,250][i%4]}px">${art(g)}</div><h3>${E(g.name)}</h3></div>`).join('')}</div></section>`,
about:()=>`<section class="sec two"><div>${head('Our Story','')}<p>${E(S.set.about)}</p><a class="btn" href="#contact">Get in touch</a></div><div class="feat"><div><span>📱</span><h3>${S.phones.length}+ phones</h3><p>In stock right now.</p></div><div><span>🎧</span><h3>${S.acc.length}+ accessories</h3><p>For every budget.</p></div><div><span>⭐</span><h3>${S.reviews.length} reviews</h3><p>From real customers.</p></div><div><span>🤝</span><h3>Honest advice</h3><p>No pressure, ever.</p></div></div></section>`,
reviews:()=>`<section class="sec">${head('Testimonials','')}<div class="two" style="margin-top:24px"><div style="display:grid;gap:14px">${S.reviews.map(rvc).join('')}</div><form class="form" onsubmit="return addRv(event)"><h3>Write a review</h3><label>Your name<input name="name" required></label><label>Rating<select name="rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label>Review<textarea name="text" rows="4" required></textarea></label><button class="btn">Post review</button></form></div></section>`,
profile:()=>{const u=S.user,w=[...S.phones,...S.acc].filter(x=>S.wish.includes(x.id));return `<section class="sec">${head('My Account','Saved on this device only.')}<div class="two" style="margin-top:24px"><form class="form" onsubmit="return upd(event)"><label>Name<input name="name" value="${E(u.name)}"></label><label>Phone<input name="phone" value="${E(u.phone)}"></label><label>Address<textarea name="addr" rows="3">${E(u.addr)}</textarea></label><button class="btn">Save profile</button></form><div><h3>Wishlist (${w.length})</h3>${w.length?`<div style="display:grid;gap:14px;margin-top:14px">${w.map(card).join('')}</div>`:'<p class="mut">Tap the heart on any product to save it here.</p>'}</div></div></section>`},
contact:()=>`<section class="sec">${head('Visit Us','Visit, call or message us.')}<div class="two" style="margin-top:24px"><div class="feat" style="grid-template-columns:1fr"><div><span>📍</span><h3>Store</h3><p>${E(S.set.addr)}</p></div><div><span>📞</span><h3>Phone</h3><p>${E(S.set.phone)}</p></div><div><span>✉️</span><h3>Email</h3><p>${E(S.set.email)}</p></div><div><span>🕙</span><h3>Hours</h3><p>Mon to Sun, 10:00 am to 9:00 pm</p></div></div><form class="form" onsubmit="return ct(event)"><h3>Send a message</h3><label>Name<input name="name" required></label><label>Message<textarea name="msg" rows="5" required></textarea></label><button class="btn wa">Send on WhatsApp</button></form></div></section>`};
let fq='',fb='All',so='';
const pl=()=>S.phones.filter(p=>(fb==='All'||p.brand===fb)&&(p.name+p.brand).toLowerCase().includes(fq.toLowerCase())).sort((a,b)=>so==='l'?a.price-b.price:so==='h'?b.price-a.price:0).map(card).join('')||'<p class="mut">No phones match your search.</p>';
function addRv(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));S.reviews.unshift({id:uid(),name:d.name,rating:+d.rating,text:d.text});save();route(1);toast('Review posted');return false}
function upd(e){e.preventDefault();S.user=Object.fromEntries(new FormData(e.target));save();toast('Profile saved');return false}
function ct(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));open(wa(`Hi Mobile Gallery, I am ${d.name}. ${d.msg}`),'_blank');return false}
const idb=(m,v)=>new Promise((ok,no)=>{const q=indexedDB.open('mg',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onerror=()=>no(q.error);q.onsuccess=()=>{const s=q.result.transaction('f',m==='get'?'readonly':'readwrite').objectStore('f'),r=m==='get'?s.get('model'):m==='put'?s.put(v,'model'):s.delete('model');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}});
/* chrome + router */
const NAV=['home','phones','accessories','gallery','about','reviews','profile','contact'];
function fixChrome(){const L={home:'Home',phones:'Smartphones',accessories:'Essentials',gallery:'Showcase',about:'Our Story',reviews:'Testimonials',profile:'My Account',contact:'Visit Us'};$('#nav').innerHTML=NAV.map(n=>`<a href="#${n}" data-p="${n}">${L[n]}</a>`).join('');$('#sf').innerHTML=`${E(S.set.phone)}`;$('#fab').href=wa('Hi Mobile Gallery, I have a question.');$('#ft').innerHTML=`<b>MobileGallery</b> · ${E(S.set.addr)} · ${E(S.set.phone)}`}
function route(keep){const h=location.hash.slice(1)||'home',k=P[h]?h:'home',y=scrollY;$('#app').innerHTML=P[k]();document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.p===k));closeMenu();cm();scrollTo(0,keep===1?y:0);if(k==='home'){spin();try{init3d()}catch(e){}}}
function menu(){$('#side').classList.toggle('open');$('#ov').classList.toggle('open')}
function closeMenu(){$('#side').classList.remove('open');$('#ov').classList.remove('open')}
function init3d(){const sc=$('.scene');if(!sc||!window.THREE)return;const T=THREE,w=sc.clientWidth,h=sc.clientHeight,r=new T.WebGLRenderer({antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(w,h);sc.innerHTML='';sc.appendChild(r.domElement);
const s=new T.Scene(),c=new T.PerspectiveCamera(35,w/h,.1,100);c.position.set(0,0,9);s.add(new T.AmbientLight(0xffffff,.75));const d=new T.DirectionalLight(0xffffff,.9);d.position.set(3,4,5);s.add(d);const d2=new T.DirectionalLight(0xb8a8ff,.7);d2.position.set(-4,-2,-3);s.add(d2);
const rr=(W,H,R)=>{const x=-W/2,y=-H/2,p=new T.Shape();p.moveTo(x+R,y);p.lineTo(x+W-R,y);p.quadraticCurveTo(x+W,y,x+W,y+R);p.lineTo(x+W,y+H-R);p.quadraticCurveTo(x+W,y+H,x+W-R,y+H);p.lineTo(x+R,y+H);p.quadraticCurveTo(x,y+H,x,y+H-R);p.lineTo(x,y+R);p.quadraticCurveTo(x,y,x+R,y);return p};
const g=new T.Group(),steel=new T.MeshStandardMaterial({color:0xb9a999,metalness:.85,roughness:.28});
const body=new T.Mesh(new T.ExtrudeGeometry(rr(2,4.2,.35),{depth:.22,bevelEnabled:true,bevelThickness:.06,bevelSize:.06,bevelSegments:6,curveSegments:16}),steel);body.position.z=-.11;g.add(body);
const cv=document.createElement('canvas');cv.width=400;cv.height=840;const x=cv.getContext('2d'),gr=x.createLinearGradient(0,0,400,840);gr.addColorStop(0,'#5b3df5');gr.addColorStop(.7,'#ff7a59');gr.addColorStop(1,'#ffd36b');x.fillStyle=gr;x.fillRect(0,0,400,840);x.fillStyle='#fff';x.textAlign='center';x.font='700 120px sans-serif';x.fillText('9:41',200,330);x.font='500 34px sans-serif';x.fillText('Mobile Gallery',200,390);x.fillStyle='#000';x.beginPath();x.arc(200,46,18,0,7);x.fill();
const sg=new T.ShapeGeometry(rr(1.84,4.04,.28),12),ps=sg.attributes.position,uv=sg.attributes.uv;for(let i=0;i<ps.count;i++)uv.setXY(i,(ps.getX(i)+.92)/1.84,(ps.getY(i)+2.02)/4.04);
const scr=new T.Mesh(sg,new T.MeshBasicMaterial({map:new T.CanvasTexture(cv)}));scr.position.z=.18;g.add(scr);
const pl=new T.Mesh(new T.ExtrudeGeometry(rr(1.05,1.05,.26),{depth:.05,bevelEnabled:false,curveSegments:12}),new T.MeshStandardMaterial({color:0x2b2a33,metalness:.6,roughness:.4}));pl.position.set(-.45,1.45,-.23);g.add(pl);
[[-.7,1.7],[-.2,1.7],[-.45,1.2]].forEach(([a,b])=>{const o=new T.Mesh(new T.CylinderGeometry(.2,.2,.06,32),new T.MeshStandardMaterial({color:0xdcd8e8,metalness:1,roughness:.2})),i=new T.Mesh(new T.CylinderGeometry(.14,.14,.08,32),new T.MeshStandardMaterial({color:0x07080f,metalness:.9,roughness:.1}));[o,i].forEach((m,n)=>{m.rotation.x=Math.PI/2;m.position.set(a,b,-.27-n*.02);g.add(m)})});
g.rotation.x=-.1;s.add(g);
if(S.set.model&&T.GLTFLoader)idb('get').then(buf=>{if(!buf)return;new T.GLTFLoader().parse(buf,'',gl=>{const m=gl.scene,b=new T.Box3().setFromObject(m),z=b.getSize(new T.Vector3()),ct=b.getCenter(new T.Vector3()),k=4.2/Math.max(z.x,z.y,z.z)*((S.set.mscale||100)/100),w2=new T.Group();m.position.sub(ct);w2.add(m);w2.scale.setScalar(k);r.outputEncoding=T.sRGBEncoding;s.add(new T.HemisphereLight(0xffffff,0x8888aa,1));m.traverse(o=>{if(o.material)o.material.needsUpdate=true});g.clear();g.add(w2)},()=>toast('This model could not be read'))}).catch(()=>{});
(function f(t){if(!document.body.contains(r.domElement)){r.dispose();r.forceContextLoss();return}if(!drag)ry+=.4;g.rotation.y=ry*Math.PI/180;g.position.y=Math.sin(t/900)*.06;r.render(s,c);requestAnimationFrame(f)})(0)}
function openP(id){const x=[...S.phones,...S.acc].find(p=>p.id===id);if(!x)return;const sp=(x.spec||'Sealed box|GST invoice|Brand warranty').split('|');$('#md').innerHTML=`<div class="mdc" role="dialog" aria-modal="true"><div class="pa" style="height:340px;margin:0">${art(x)}</div><div><small style="color:var(--ac);font-weight:600">${E(x.brand||'Essentials')}</small><h2 style="font-size:30px;margin:4px 0 8px">${E(x.name)}</h2><b style="font:700 26px Sora,sans-serif">${inr(x.price)}</b><p class="mut">${E(x.desc)}</p><div class="sp">${sp.map(t=>`<span>${E(t.trim())}</span>`).join('')}</div><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn wa" target="_blank" rel="noopener" href="${wa(`Hi Mobile Gallery, I want to buy ${x.name} (${inr(x.price)})`)}">Buy on WhatsApp</a><button class="btn ghost" onclick="cm()">Close</button></div></div></div>`;$('#md').classList.add('open');document.body.style.overflow='hidden'}
const cm=()=>{$('#md').classList.remove('open');document.body.style.overflow=''};addEventListener('keydown',e=>{if(e.key==='Escape')cm()});
let ry=-28,drag=0,lx=0,spinning=0;
function spin(){if(spinning)return;spinning=1;(function f(){const p=$('#ph3d');if(!p){spinning=0;return}if(!drag)ry+=.4;p.style.transform=`rotateX(-6deg) rotateY(${ry}deg)`;requestAnimationFrame(f)})()}
addEventListener('pointerdown',e=>{if(e.target.closest('.scene')){drag=1;lx=e.clientX}});
addEventListener('pointermove',e=>{if(drag){ry+=(e.clientX-lx)*.6;lx=e.clientX}});
addEventListener('pointerup',()=>drag=0);addEventListener('pointercancel',()=>drag=0);addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches&&e.target.matches('.pa[role=button]'))e.target.click()});let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if($('.scene canvas'))try{init3d()}catch(e){}},300)});
addEventListener('hashchange',()=>route());
fixChrome();route();
addEventListener('storage',e=>{if(e.key==='mg_db'&&e.newValue){try{S=JSON.parse(e.newValue);route(1)}catch(x){}}});
</script></body></html>
