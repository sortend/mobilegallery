const ico=n=>{n=n.toLowerCase();return /bud|head|ear|airpod/.test(n)?'ear':/charg|adapter/.test(n)?'plug':/cable|cord/.test(n)?'cable':/case|cover/.test(n)?'case':/glass|guard/.test(n)?'shield':/power|bank/.test(n)?'bank':/watch|band/.test(n)?'watch':'stand'};
const pic=c=>{const k=++gk,L=[[21,21],[39,21],[30,39]].map(([a,b])=>`<circle cx="${a}" cy="${b}" r="8" fill="url(#l${k})" stroke="#c9c9d3" stroke-width="2"/>`).join('');return `<svg viewBox="0 0 230 280" class="ps" role="img" aria-label="Phone"><defs><linearGradient id="b${k}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".4"/></linearGradient><radialGradient id="l${k}"><stop offset=".25" stop-color="#4b6fbf"/><stop offset=".55" stop-color="#0b0c14"/></radialGradient><linearGradient id="s${k}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="#15141c"/></linearGradient></defs><g transform="translate(8 14)"><rect width="104" height="226" rx="22" fill="${c}"/><rect width="104" height="226" rx="22" fill="url(#b${k})" stroke="#d9d9df" stroke-width="2.5"/><rect x="9" y="9" width="42" height="42" rx="12" fill="#fff" fill-opacity=".2" stroke="#fff" stroke-opacity=".4"/>${L}</g><g transform="translate(118 30)"><rect width="104" height="226" rx="22" fill="#0d0d12" stroke="#cfcfd8" stroke-width="2.5"/><rect x="5" y="5" width="94" height="216" rx="17" fill="url(#s${k})"/><rect x="38" y="11" width="28" height="8" rx="4" fill="#000"/><text x="52" y="92" text-anchor="middle" fill="#fff" font-size="26" font-weight="700" font-family="Sora,sans-serif">9:41</text></g></svg>`};
const art=x=>x.img?`<img src="${E(x.img)}" alt="${E(x.name)}">`:x.price==null?`<div class="gt" style="--c:${E(x.color||'#5b3df5')}">${E(x.name)}</div>`:x.color?pic(E(x.color)):`<svg viewBox="0 0 48 48" class="ic" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${IP[ico(x.name)]}</svg>`;
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
const card=x=>`<article class="card"><button class="hrt ${S.wish.includes(x.id)?'on':''}" onclick="wish('${x.id}')" aria-label="Save to wishlist">♥</button><div class="pa" role="button" tabindex="0" style="cursor:pointer" onclick="openP('${x.id}')">${art(x)}</div><small>${E(x.brand||'Essentials')}</small><h3 style="cursor:pointer" onclick="openP('${x.id}')">${E(x.name)}</h3><p>${E(x.desc)}</p><div class="row"><b>${inr(x.price)}</b><a class="btn wa" target="_blank" rel="noopener" href="${wa(`Hi Mobile Gallery, I want to buy ${x.name} (${inr(x.price)})`)}">Buy on WhatsApp</a></div></article>`;
function wish(id){const i=S.wish.indexOf(id);i<0?S.wish.push(id):S.wish.splice(i,1);save();route(1)}
const rvc=r=>`<div class="rv"><div class="st">${stars(r.rating)}</div><p>${E(r.text)}</p><b>${E(r.name)}</b></div>`;
const head=(t,s)=>`<h1>${t}</h1><p class="mut">${s}</p>`;
/* admin */
const CF={phones:['Phones',[['name','Name'],['brand','Brand'],['price','Price (₹)','number'],['color','Colour','color'],['desc','Description','area'],['spec','Specs: 8GB | 256GB | 5000mAh'],['img','Photo','file']]],acc:['Accessories',[['name','Name'],['price','Price (₹)','number'],['desc','Description','area'],['img','Photo','file']]],gallery:['Gallery',[['name','Title'],['color','Colour','color'],['img','Photo','file']]],reviews:['Reviews',[['name','Name'],['rating','Rating (1 to 5)','number'],['text','Review','area']]],model:['3D Model'],set:['Settings']};
let tab='phones',ed=null,adm=false;
function adminView(){
if(!adm)return `<section class="sec" style="max-width:420px">${head('Admin login','Enter the admin password.')}<form class="form" style="margin-top:20px" onsubmit="return lg(event)">${FBOK?'<label>Email<input type="email" name="em" required></label>':''}<label>Password<input type="password" name="p" required></label><button class="btn">Log in</button>${FBOK?'':'<small class="mut">Demo mode: Firebase is not set up. Default password: admin123.</small>'}</form></section>`;
const tabs=Object.entries(CF).map(([k,v])=>`<button class="chip ${k===tab?'on':''}" onclick="tab='${k}';ed=null;route(1)">${v[0]}</button>`).join('');
let body;
if(tab==='model')body=mdView();else if(tab==='set'){const s=S.set;body=`<form class="form" onsubmit="return ss(event)">${[['wa','WhatsApp number (country code, no +)'],['phone','Phone'],['email','Email'],['addr','Address']].concat(FBOK?[]:[['pass','Admin password']]).map(([k,l])=>`<label>${l}<input name="${k}" value="${E(s[k])}" required></label>`).join('')}<label>About text<textarea name="about" rows="5">${E(s.about)}</textarea></label><button class="btn">Save settings</button><button type="button" class="btn red" onclick="rs()">${FBOK?'Load sample data':'Reset all data'}</button></form>`}
else if(ed)body=adminForm();
else body=`<p><button class="btn" onclick="ed='new';route(1)">+ Add new</button></p>`+S[tab].map(x=>`<div class="tb"><div class="pa">${art(x)}</div><div><b>${E(x.name)}</b><div class="mut" style="font-size:13px">${x.price!=null?inr(x.price):x.rating?stars(x.rating):''}</div></div><button class="btn ghost" onclick="ed='${x.id}';route(1)">Edit</button><button class="btn red" onclick="del('${x.id}')">Delete</button></div>`).join('')||'<p class="mut">Nothing here yet. Add your first item.</p>';
return `<section class="sec"><div class="row" style="display:flex;justify-content:space-between;align-items:center"><h1>Admin panel</h1><button class="btn ghost" onclick="out()">Log out</button></div><div class="tabs">${tabs}</div>${body}</section>`}
function adminForm(){const [t,fs]=CF[tab],o=ed==='new'?{}:S[tab].find(x=>x.id===ed)||{};return `<form id="f" class="form" onsubmit="return sv(event)"><h3>${ed==='new'?'Add to':'Edit'} ${t}</h3>${fs.map(([k,l,ty])=>ty==='area'?`<label>${l}<textarea name="${k}" rows="3">${E(o[k])}</textarea></label>`:ty==='file'?`<label>${l}<input type="file" accept="image/*" onchange="upl(this)"><input type="hidden" name="img" id="imgv" value="${E(o.img||'')}"><img id="pv" class="pv" alt="" src="${E(o.img||'')}" ${o.img?'':'hidden'}></label>`:`<label>${l}<input name="${k}" type="${ty||'text'}" value="${E(o[k]??(ty==='color'?'#5b3df5':''))}" ${k==='name'||ty==='number'?'required step="any"':''}></label>`).join('')}<div style="display:flex;gap:10px"><button class="btn">Save</button><button type="button" class="btn ghost" onclick="ed=null;route(1)">Cancel</button></div></form>`}
const idb=(m,v)=>new Promise((ok,no)=>{const q=indexedDB.open('mg',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onerror=()=>no(q.error);q.onsuccess=()=>{const s=q.result.transaction('f',m==='get'?'readonly':'readwrite').objectStore('f'),r=m==='get'?s.get('model'):m==='put'?s.put(v,'model'):s.delete('model');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}});
function mdView(){const m=S.set.model;return `<div class="form"><h3>Home page 3D phone</h3><p class="mut" style="margin:0">Upload a .glb file to replace the built-in phone on the Home page. Use one self-contained .glb file (under about 20 MB, no Draco compression).</p><label>3D model file (.glb)<input type="file" accept=".glb,model/gltf-binary" onchange="upm(this)"></label><p style="margin:0">${m?`Current model: <b>${E(m.name)}</b> (${(m.size/1048576).toFixed(1)} MB)`:'Using the built-in phone.'}</p><label>Size on screen: <span id="msv">${S.set.mscale||100}</span>%<input type="range" min="40" max="200" value="${S.set.mscale||100}" oninput="$('#msv').textContent=this.value;S.set.mscale=+this.value;save()"></label><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn ghost" href="../website/index.html">Preview on website</a>${m?'<button class="btn red" onclick="rmm()">Remove model</button>':''}</div></div>`}
async function upm(i){const f=i.files[0];if(!f)return;if(!/\.glb$/i.test(f.name))return toast('Please choose a .glb file');try{let url='';if(FBOK&&fst){toast('Uploading...');const r=fst.ref('models/phone.glb');await r.put(f);url=await r.getDownloadURL()}else await idb('put',await f.arrayBuffer());S.set.model={name:f.name,size:f.size,url};if(FBOK)await fdb.doc('settings/main').set({model:S.set.model},{merge:true});else save();route(1);toast('Model saved.')}catch(e){toast('Upload failed: '+(e.code||e.message))}}
async function rmm(){try{await idb('del')}catch(e){}delete S.set.model;if(FBOK)await fdb.doc('settings/main').update({model:firebase.firestore.FieldValue.delete()}).catch(()=>{});else save();route(1);toast('Model removed')}
function lg(e){e.preventDefault();const f=new FormData(e.target);if(FBOK){fauth.signInWithEmailAndPassword(f.get('em'),f.get('p')).catch(()=>toast('Wrong email or password'));return false}if(f.get('p')===S.set.pass){adm=true;route(1)}else toast('Wrong password');return false}
function out(){if(FBOK)fauth.signOut();adm=false;route(1)}
function sv(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if('price'in d)d.price=+d.price;if('rating'in d)d.rating=Math.min(5,Math.max(1,Math.round(+d.rating)));let it;if(ed==='new'){it={id:uid(),...d,ts:Date.now()};S[tab].unshift(it)}else{it=S[tab].find(x=>x.id===ed);Object.assign(it,d)}if(FBOK)fdb.collection(tab).doc(it.id).set(it).catch(e=>toast('Save failed: '+e.code));else save();ed=null;route(1);toast('Saved');return false}
function del(id){if(confirm('Delete this item? This cannot be undone.')){S[tab]=S[tab].filter(x=>x.id!==id);S.wish=S.wish.filter(w=>w!==id);if(FBOK)fdb.collection(tab).doc(id).delete().catch(e=>toast('Delete failed: '+e.code));else save();route(1);toast('Deleted')}}
function ss(e){e.preventDefault();Object.assign(S.set,Object.fromEntries(new FormData(e.target)));if(FBOK){const{pass,...o}=S.set;fdb.doc('settings/main').set(o,{merge:true}).catch(e=>toast('Save failed: '+e.code))}else save();toast('Settings saved');return false}
function rs(){if(!confirm(FBOK?'Add the sample phones, accessories and reviews to the database?':'Reset everything to the sample data?'))return;const d=seed();if(!FBOK){S=d;save();route(1);return}const b=fdb.batch();let n=Date.now();COLS.forEach(c=>d[c].forEach(x=>b.set(fdb.collection(c).doc(x.id),{...x,ts:n--})));const{pass,...o}=d.set;b.set(fdb.doc('settings/main'),o,{merge:true});b.commit().then(()=>toast('Sample data added')).catch(e=>toast('Failed: '+e.code))}
function upl(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const m=new Image();m.onload=()=>{const k=Math.min(1,640/Math.max(m.width,m.height)),c=document.createElement('canvas');c.width=m.width*k;c.height=m.height*k;c.getContext('2d').drawImage(m,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.82);$('#imgv').value=u;$('#pv').src=u;$('#pv').hidden=false};m.src=r.result};r.readAsDataURL(f)}
function fixChrome(){}
function route(k){const y=scrollY;$('#app').innerHTML=adminView();scrollTo(0,k===1?y:0)}
addEventListener('storage',e=>{if(e.key==='mg_db'&&e.newValue&&!ed){try{S=JSON.parse(e.newValue);route(1)}catch(x){}}});
let synced=0;route();
if(FBOK)fauth.onAuthStateChanged(u=>{adm=!!u;if(u&&!synced){synced=1;sync()}route(1)});
</script></body></html>
